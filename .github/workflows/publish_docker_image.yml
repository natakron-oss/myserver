name: Publish Docker image

# ทำงานต่อจาก Workflow 3 (unit test) เมื่อ Workflow 3 ผ่านเท่านั้น
# main -> Workflow 3 (unit test) -> Publish Docker image
on:
  workflow_run:
    workflows: ["Workflow 3"]
    types:
      - completed
    branches: [main]
  workflow_dispatch:   # กดรันเองได้จากหน้า Actions

jobs:
  push_to_registry:
    name: Push Docker image to Docker Hub
    runs-on: ubuntu-latest
    # รันเมื่อ Workflow 3 สำเร็จ หรือกดรันเอง
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          # ใช้ commit เดียวกับที่ผ่านการ test
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/myserver
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
