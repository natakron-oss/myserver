name: Workflow 3

on:
  workflow_run:
    workflows: ["main"]
    types:
      - completed

jobs:
  integration-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Run Integration Test
        run: npm test