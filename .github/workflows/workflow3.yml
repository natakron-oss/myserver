name: Workflow 3

on:
  workflow_run:
    workflows: ["main"]
    types:
      - completed

jobs:
  unit-test:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Build
        run: npm run build

      - name: Run Unit Test
        run: npm test